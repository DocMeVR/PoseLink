name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release to rebuild the zip for (for example 1.3.0). Empty: only run release-please."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Runs once release-please has merged a release PR and created the release: packs the extension zip
  # (what Blender's Install from Disk takes) and attaches it.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The add-on folder as Blender's extension build packs it (minus the manifest's exclude list), plus the licence
      - name: Create Extension Zip
        id: zip
        run: |
          python3 - <<'PY'
          import fnmatch, os, tomllib, zipfile
          src = "pose_link"
          manifest = tomllib.load(open(os.path.join(src, "blender_manifest.toml"), "rb"))
          excluded = manifest.get("build", {}).get("paths_exclude_pattern", [])

          def skip(rel):
              parts = rel.split("/")
              for pattern in excluded:
                  name = pattern.strip("/")
                  if pattern.endswith("/"):
                      if name in parts[:-1]:
                          return True
                  elif fnmatch.fnmatch(parts[-1], name):
                      return True
              return False

          out = f"{manifest['id']}-{manifest['version']}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk(src):
                  for f in files:
                      rel = os.path.relpath(os.path.join(root, f), src).replace(os.sep, "/")
                      if not skip(rel):
                          z.write(os.path.join(root, f), rel)
              z.write("LICENSE.md", "LICENSE.md")
          print(out, zipfile.ZipFile(out).namelist())
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"file={out}\n")
          PY

      - name: Attach Zip To Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.zip.outputs.file }}" --clobber
