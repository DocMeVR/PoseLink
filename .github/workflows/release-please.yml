name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release to rebuild the zip for (for example 1.3.0). Empty: only run release-please."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Runs once release-please has merged a release PR and created the release: packs the extension zip
  # (what Blender's Install from Disk takes) and attaches it.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Same files as `blender --command extension build`: everything except the manifest's paths_exclude_pattern.
      - name: Create Extension Zip
        id: zip
        run: |
          python3 - <<'PY'
          import fnmatch, os, tomllib, zipfile
          m = tomllib.load(open("blender_manifest.toml", "rb"))
          pats = m.get("build", {}).get("paths_exclude_pattern", [])

          def skip(rel):
              parts = rel.split("/")
              for p in pats:
                  anchored, name = p.startswith("/"), p.strip("/")
                  if p.endswith("/"):
                      dirs = parts[:-1]
                      if (anchored and dirs[:1] == [name]) or (not anchored and name in dirs):
                          return True
                  elif fnmatch.fnmatch(rel if anchored else parts[-1], name):
                      return True
              return False

          out = f"{m['id']}-{m['version']}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for f in files:
                      rel = os.path.relpath(os.path.join(root, f), ".").replace(os.sep, "/")
                      if rel != out and not skip(rel):
                          z.write(rel, rel)
          print(out, zipfile.ZipFile(out).namelist())
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"file={out}\n")
          PY

      - name: Attach Zip To Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.zip.outputs.file }}" --clobber
